name: demo-bot-label
on:
  pull_request:
    types: [opened]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit "$PR" --repo "$REPO" --add-label gate-change-approved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
