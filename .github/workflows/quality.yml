name: quality

# Un label posé ou retiré rejoue la gate complète, sans allègement : le juge hors PR
# (`quality-verdict`) reprend la conclusion de ce run et recalcule le statut `quality`, qui suit
# ainsi la pose ou le retrait d'un label d'approbation (D-15).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.12
          install_args: "--locked"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate
          path: reports/gate.json

  # Hygiène (D-15) : chaque push retire les labels d'approbation. L'autorité reste la comparaison
  # d'horodatage faite par le juge hors PR ; ce job n'en dépend pas et son échec est sans effet.
  reset-approval:
    name: reset-approval
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      pull-requests: write # retrait des labels d'approbation au push (hygiène, D-15)
    steps:
      - run: gh pr edit "$PR" --repo "$REPO" --remove-label gate-change-approved --remove-label deps-approved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
