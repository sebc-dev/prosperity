# Propriétés du projet Sonar (D-16, advisory). Fichier protégé : aucune adresse, aucun jeton, aucun
# proxy ici ; `pnpm sonar` refuse un fichier qui en définit. L'hôte et le jeton viennent de l'extérieur.
sonar.projectKey=prosperity
sonar.projectName=Prosperity
sonar.sourceEncoding=UTF-8

sonar.sources=src,quality
sonar.tests=src,quality,test
sonar.test.inclusions=**/*.test.ts
# Les cas d'auto-test de la gate portent des violations volontaires.
sonar.exclusions=**/*.test.ts,quality/selftest/cases/**
sonar.test.exclusions=quality/selftest/cases/**
# La couverture Vitest ne porte que sur src/**.
sonar.coverage.exclusions=quality/**

sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=reports/sonar/coverage/lcov.info
sonar.eslint.reportPaths=reports/sonar/eslint.json,reports/sonar/eslint-security.json
sonar.working.directory=reports/sonar/scannerwork
